<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Prontuário Eletrônico</title>

    <!-- Ligação com o arquivo de estilos -->
    <link rel="stylesheet" href="Cadastro.css">
</head>
<body>

    <!-- Onda decorativa no canto inferior esquerdo (apenas enfeite) -->
    <svg class="onda" viewBox="0 0 300 260" aria-hidden="true">
        <defs>
            <linearGradient id="gradienteOnda" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#9b6bd6" />
                <stop offset="100%" stop-color="#6a3aa8" />
            </linearGradient>
        </defs>
        <path d="M0 95 C 70 110, 130 150, 150 200 C 162 230, 172 248, 178 260 L 0 260 Z" fill="url(#gradienteOnda)" />
        <path d="M0 45 C 95 60, 175 120, 205 195 C 216 222, 224 244, 230 260" fill="none" stroke="#e75ea8" stroke-width="3" />
    </svg>

    <!-- ===== TOPO: logo + botões de acessibilidade ===== -->
    <header class="topo">
        <div class="logo">
            <svg class="logo-icone" viewBox="0 0 24 24" aria-hidden="true">
                <defs>
                    <linearGradient id="gradienteLogo" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#e75ea8" />
                        <stop offset="100%" stop-color="#7b4bb7" />
                    </linearGradient>
                </defs>
                <!-- Coração -->
                <path d="M12 20.5 L4.6 13.3 C2.6 11.3 2.5 8 4.4 6 C6.3 4 9.5 4 11.4 6 L12 6.6 L12.6 6 C14.5 4 17.7 4 19.6 6 C21.5 8 21.4 11.3 19.4 13.3 Z"
                      fill="none" stroke="url(#gradienteLogo)" stroke-width="1.6" stroke-linejoin="round" />
                <!-- Linha de batimento cardíaco -->
                <path d="M3.5 12 H8.5 L10 9.5 L12 14.5 L13.8 10.5 L15 12 H20.5"
                      fill="none" stroke="url(#gradienteLogo)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="logo-texto">Prontuário<br>Eletrônico</span>
        </div>

        <div class="acessibilidade">
            <button type="button" class="btn-acess" id="btnDiminuir" aria-label="Diminuir fonte">A−</button>
            <button type="button" class="btn-acess" id="btnAumentar" aria-label="Aumentar fonte">A+</button>
            <button type="button" class="btn-acess" id="btnTema" aria-label="Alternar para tema escuro">
                <!-- Sol: aparece no tema claro -->
                <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
                <!-- Lua: aparece no tema escuro -->
                <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- ===== CONTEÚDO PRINCIPAL ===== -->
    <main class="conteudo">
        <h1 class="titulo">CRIAR CONTA</h1>

        <!-- Barrinhas rosa e roxa abaixo do título -->
        <div class="barras" aria-hidden="true">
            <span class="barra barra-rosa"></span>
            <span class="barra barra-roxa"></span>
        </div>

        <!-- novalidate: desliga a validação padrão do navegador, pois a nossa é feita no JavaScript -->
        <form id="formCadastro" novalidate>

            <!-- Nome completo -->
            <div class="campo">
                <label for="nome">Nome completo</label>
                <div class="caixa">
                    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
                    </svg>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" autocomplete="name">
                </div>
                <span class="erro" id="erroNome"></span>
            </div>

            <!-- CPF -->
            <div class="campo">
                <label for="cpf">CPF</label>
                <div class="caixa">
                    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="3" width="14" height="18" rx="2" />
                        <path d="M9 8h6M9 12h6M9 16h4" />
                    </svg>
                    <input type="text" id="cpf" placeholder="Digite seu CPF" inputmode="numeric" autocomplete="off">
                </div>
                <span class="erro" id="erroCpf"></span>
            </div>

            <!-- Senha -->
            <div class="campo">
                <label for="senha">Senha</label>
                <div class="caixa">
                    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="10" rx="2" />
                        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
                    </svg>
                    <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="new-password">
                    <button type="button" class="btn-olho" data-alvo="senha" aria-label="Mostrar senha">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                            <circle cx="12" cy="12" r="3" />
                            <line class="risco" x1="3" y1="3" x2="21" y2="21" />
                        </svg>
                    </button>
                </div>
                <span class="erro" id="erroSenha"></span>
            </div>

            <!-- Confirmar senha -->
            <div class="campo">
                <label for="confirmarSenha">Confirmar senha</label>
                <div class="caixa">
                    <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="11" width="14" height="10" rx="2" />
                        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
                    </svg>
                    <input type="password" id="confirmarSenha" placeholder="Confirme sua senha" autocomplete="new-password">
                    <button type="button" class="btn-olho" data-alvo="confirmarSenha" aria-label="Mostrar senha">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                            <circle cx="12" cy="12" r="3" />
                            <line class="risco" x1="3" y1="3" x2="21" y2="21" />
                        </svg>
                    </button>
                </div>
                <span class="erro" id="erroConfirmar"></span>
            </div>

            <button type="submit" class="btn-cadastrar" id="btnCadastrar">Cadastrar</button>

            <!-- Mensagem de sucesso (fica vazia até o cadastro dar certo) -->
            <p class="sucesso" id="mensagemSucesso" role="status"></p>
        </form>

        <p class="entrar">Já possui uma conta? <a href="Login.html">Entrar</a></p>
    </main>

    <!-- Ligação com o arquivo JavaScript (no final, para o HTML já estar carregado) -->
    <script src="Cadastro.js"></script>
</body>
</html>
