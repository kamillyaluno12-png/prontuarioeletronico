<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prontuários | Prontuário Eletrônico de Enfermagem</title>

    <!-- Ligação com o arquivo de estilos -->
    <link rel="stylesheet" href="Tela-prontuario.css">
</head>
<body>

    <!-- Onda decorativa no canto inferior esquerdo (apenas enfeite) -->
    <svg class="onda" viewBox="0 0 300 260" aria-hidden="true">
        <defs>
            <linearGradient id="gradienteOnda" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#9b6bd6" />
                <stop offset="100%" stop-color="#6a3aa8" />
            </linearGradient>
        </defs>
        <path d="M0 95 C 70 110, 130 150, 150 200 C 162 230, 172 248, 178 260 L 0 260 Z" fill="url(#gradienteOnda)" />
        <path d="M0 45 C 95 60, 175 120, 205 195 C 216 222, 224 244, 230 260" fill="none" stroke="#e75ea8" stroke-width="3" />
    </svg>

    <!-- ===================== TOPO ===================== -->
    <header class="topo">
        <div class="logo">
            <svg class="logo-icone" viewBox="0 0 24 24" aria-hidden="true">
                <defs>
                    <linearGradient id="gradienteLogo" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#e75ea8" />
                        <stop offset="100%" stop-color="#7b4bb7" />
                    </linearGradient>
                </defs>
                <path d="M12 20.5 L4.6 13.3 C2.6 11.3 2.5 8 4.4 6 C6.3 4 9.5 4 11.4 6 L12 6.6 L12.6 6 C14.5 4 17.7 4 19.6 6 C21.5 8 21.4 11.3 19.4 13.3 Z"
                      fill="url(#gradienteLogo)" />
                <path d="M3.5 12 H8.5 L10 9.5 L12 14.5 L13.8 10.5 L15 12 H20.5"
                      fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="logo-texto">
                <strong>PRONTUÁRIO ELETRÔNICO</strong>
                <span>DE ENFERMAGEM</span>
            </div>
        </div>

        <div class="ferramentas">
            <button type="button" class="btn-acess" id="btnDiminuir" aria-label="Diminuir letras">A−</button>
            <button type="button" class="btn-acess" id="btnAumentar" aria-label="Aumentar letras">A+</button>

            <button type="button" class="btn-tema" id="btnTema" aria-label="Alternar para tema escuro">
                <svg class="ic icone-sol" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
                <svg class="ic icone-lua" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
                </svg>
                <span class="texto-claro">Tema claro</span>
                <span class="texto-escuro">Tema escuro</span>
            </button>

            <button type="button" class="btn-sair" id="btnSair">
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3" />
                    <path d="M14 16l4-4-4-4M18 12H9" />
                </svg>
                Sair
            </button>
        </div>
    </header>

    <div class="estrutura">

        <!-- ===================== MENU ===================== -->
        <nav class="menu" aria-label="Menu principal">
            <ul>
                <li>
                    <a href="Tela-inicial.html">
                        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="4" />
                            <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5" />
                        </svg>
                        Paciente
                    </a>
                </li>
                <li>
                    <a href="Tela-prontuario.html" class="ativo" aria-current="page">
                        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="4" width="14" height="17" rx="2" />
                            <path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h4" />
                        </svg>
                        Prontuários
                    </a>
                </li>
                <li>
                    <a href="Evolucao-enfermagem.html">
                        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 3h6v3H9zM7 4.5H6a1 1 0 0 0-1 1V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5.5a1 1 0 0 0-1-1h-1" />
                            <path d="M8 14h2.5l1.5-3 2 5 1.5-2H17" />
                        </svg>
                        Evolução de Enfermagem
                    </a>
                </li>
                <li>
                    <a href="Setembro-amarelo.html" class="link-setembro">
                        <svg class="ic laco" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2c-2.2 0-4 1.8-4 4 0 1.6.9 3.3 2 5l-5 9 3 1.5 4-7 4 7 3-1.5-5-9c1.1-1.7 2-3.4 2-5 0-2.2-1.8-4-4-4Zm0 2.2c1 0 1.8.8 1.8 1.8 0 .9-.7 2.2-1.8 3.8-1.1-1.6-1.8-2.9-1.8-3.8 0-1 .8-1.8 1.8-1.8Z" />
                        </svg>
                        Setembro Amarelo
                    </a>
                </li>
            </ul>
        </nav>

        <!-- ===================== CONTEÚDO ===================== -->
        <main class="principal">

            <div class="cabecalho-pagina">
                <div>
                    <h1>Prontuários</h1>
                    <p>Visualize e gerencie os registros de atendimento dos pacientes.</p>
                </div>

                <div class="cabecalho-acoes">
                    <!-- Busca -->
                    <div class="busca">
                        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="11" cy="11" r="7" />
                            <path d="M20 20l-4-4" />
                        </svg>
                        <label for="campoBusca" class="somente-leitor">Buscar pacientes</label>
                        <input type="search" id="campoBusca" placeholder="Buscar por nome, ID ou prontuário dos pacientes" autocomplete="off">
                    </div>

                    <!-- Abre a Tela-inicial com o formulário vazio para um novo paciente -->
                    <a href="Tela-inicial.html" class="btn-novo">
                        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
                        Novo prontuário
                    </a>
                </div>
            </div>

            <!-- ===== LISTA DE PACIENTES (montada pelo JavaScript) ===== -->
            <section class="lista-card" aria-label="Lista de pacientes">
                <!-- Títulos das colunas (some no celular) -->
                <div class="lista-topo" aria-hidden="true">
                    <span>Paciente</span>
                    <span>ID</span>
                    <span>Prontuário</span>
                    <span>Último atendimento</span>
                    <span>Status</span>
                    <span>Detalhes</span>
                </div>

                <div id="listaPacientes"></div>
            </section>

            <!-- ===== CONTADOR E PAGINAÇÃO ===== -->
            <div class="rodape-lista">
                <p class="contador" id="contador" role="status"></p>
                <nav class="paginacao" id="paginacao" aria-label="Páginas da lista"></nav>
            </div>
        </main>
    </div>

    <!-- Ligação com o arquivo JavaScript -->
    <script src="Tela-prontuario.js"></script>
</body>
</html>
